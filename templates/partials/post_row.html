<article class="border-b border-line" data-tags="{% for tag in post.tags.all %}{{ tag.name }}{% if not forloop.last %}|{% endif %}{% endfor %}">
    <a href="{{ post.get_absolute_url }}" class="group flex flex-wrap items-baseline justify-between gap-x-6 gap-y-2 py-5">
        <h3 class="text-lg font-semibold group-hover:text-brand-700">{{ post.title }}</h3>
        {% with tags=post.tags.all %}
        {% if tags %}
        <p class="text-sm text-subtle">{% for tag in tags %}{{ tag.name }}{% if not forloop.last %} · {% endif %}{% endfor %}</p>
        {% endif %}
        {% endwith %}
    </a>
</article>
