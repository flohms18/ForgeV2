<article class="border-b border-line">
    <a href="{{ post.get_absolute_url }}" class="group flex flex-wrap items-baseline justify-between gap-x-6 gap-y-2 py-5">
        <h3 class="text-lg font-semibold group-hover:text-brand-700">{{ post.title }}</h3>
        <p class="text-sm text-subtle">
            {% for tag in post.tags.all %}{{ tag.name }} · {% endfor %}<time datetime="{{ post.published_at|date:'Y-m-d' }}">{{ post.published_at|date:"j F Y" }}</time>
        </p>
    </a>
</article>
