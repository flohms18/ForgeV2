{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Forge{% endblock %}</title>
    <link rel="icon" href="{% static 'img/favicon.svg' %}" type="image/svg+xml">
    {% tailwind_css %}
</head>

<body class="bg-white font-sans text-ink antialiased">
    <header class="border-b border-line">
        <nav class="mx-auto flex max-w-[1200px] flex-wrap items-center justify-between gap-4 px-6 py-5">
            <a href="{% url 'home' %}" class="flex items-center gap-2.5 font-display text-2xl font-bold text-ink">
                <img src="{% static 'img/forge-mark.svg' %}" alt="" width="36" height="36" class="size-9">
                <span>Forge</span>
            </a>
            <div class="flex flex-wrap items-center gap-7 text-[15px] font-medium">
                <a href="{% url 'home' %}#projets" class="hover:text-brand-700">Projets</a>
                <a href="{% url 'post_list' %}" class="hover:text-brand-700">Articles</a>
                <a href="{% url 'about' %}" class="hover:text-brand-700">À propos</a>
                <a href="{% url 'home' %}#contact" class="rounded-lg bg-brand-600 px-[18px] py-2.5 text-white hover:bg-brand-700">Me contacter</a>
            </div>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="flex items-center justify-center gap-2.5 border-t border-line p-6 text-sm text-subtle">
        <img src="{% static 'img/forge-avatar.svg' %}" alt="" width="24" height="24" class="size-6">
        <span>Made by F.T</span>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
