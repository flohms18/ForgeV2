{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <script>document.documentElement.classList.add("js")</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Forge{% endblock %}</title>
    <link rel="icon" href="{% static 'img/favicon.svg' %}" type="image/svg+xml">
    {% tailwind_css %}
</head>

<body class="bg-white font-sans text-ink antialiased">
    <header class="border-b border-line">
        <nav class="mx-auto flex max-w-[1200px] flex-wrap items-center justify-between gap-4 px-6 py-5">
            <a href="{% url 'home' %}" class="group flex items-center gap-2.5 font-display text-2xl font-bold text-ink">
                <img src="{% static 'img/forge-mark.svg' %}" alt="" width="36" height="36" class="size-9 transition-transform duration-300 group-hover:-rotate-12 group-hover:scale-110">
                <span>Forge</span>
            </a>
            <div class="flex flex-wrap items-center gap-7 text-[15px] font-medium">
                <a href="{% url 'home' %}#projets" class="nav-link hover:text-brand-700">Projets</a>
                <a href="{% url 'home' %}#articles" class="nav-link hover:text-brand-700">Articles</a>
                <a href="{% url 'about' %}" class="nav-link hover:text-brand-700">À propos</a>
                <a href="{% url 'post_detail' 'agent-ia' %}" class="nav-link text-brand-500 hover:text-brand-700">C'est quoi un agent IA&nbsp;?</a>
                <div class="flex items-center gap-2">
                    <a href="https://www.linkedin.com/in/florent-trouillet/" target="_blank" rel="noopener" aria-label="LinkedIn (nouvel onglet)" class="flex size-10 items-center justify-center rounded-full border border-line-strong text-ink transition-colors duration-200 hover:border-ink hover:bg-ink hover:text-white">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 1 1 0-4.13 2.06 2.06 0 0 1 0 4.13zM7.12 20.45H3.56V9h3.56v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.73v20.54C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.73V1.73C24 .77 23.2 0 22.22 0z"/></svg>
                    </a>
                    <a href="https://github.com/flohms18" target="_blank" rel="noopener" aria-label="GitHub (nouvel onglet)" class="flex size-10 items-center justify-center rounded-full border border-line-strong text-ink transition-colors duration-200 hover:border-ink hover:bg-ink hover:text-white">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .3a12 12 0 0 0-3.8 23.38c.6.12.83-.26.83-.57L9 21.07c-3.34.72-4.04-1.61-4.04-1.61-.55-1.39-1.34-1.76-1.34-1.76-1.08-.74.09-.73.09-.73 1.2.09 1.83 1.24 1.83 1.24 1.07 1.83 2.81 1.3 3.5 1 .1-.78.42-1.31.76-1.61-2.67-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.14-.3-.54-1.52.1-3.18 0 0 1-.32 3.3 1.23a11.5 11.5 0 0 1 6 0c2.28-1.55 3.29-1.23 3.29-1.23.64 1.66.24 2.88.12 3.18a4.65 4.65 0 0 1 1.23 3.22c0 4.61-2.8 5.63-5.48 5.92.42.36.81 1.1.81 2.22l-.01 3.29c0 .32.21.69.82.57A12 12 0 0 0 12 .3"/></svg>
                    </a>
                </div>
            </div>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="border-t border-line bg-surface">
        <div class="mx-auto grid max-w-[1200px] gap-10 px-6 pt-14 pb-10 sm:grid-cols-[2fr_1fr]">
            <div class="flex flex-col gap-4">
                <a href="{% url 'home' %}" class="group flex w-fit items-center gap-2.5 font-display text-xl font-bold text-ink">
                    <img src="{% static 'img/forge-mark.svg' %}" alt="" width="32" height="32" class="size-8 transition-transform duration-300 group-hover:-rotate-12 group-hover:scale-110">
                    <span>Forge</span>
                </a>
            </div>

            <nav aria-label="Pied de page" class="flex flex-col gap-3 text-[15px]">
                <p class="text-xs font-semibold uppercase tracking-[0.08em] text-subtle">Navigation</p>
                <a href="{% url 'home' %}#projets" class="nav-link w-fit text-ink hover:text-brand-700">Projets</a>
                <a href="{% url 'home' %}#articles" class="nav-link w-fit text-ink hover:text-brand-700">Articles</a>
                <a href="{% url 'about' %}" class="nav-link w-fit text-ink hover:text-brand-700">À propos</a>
                <a href="{% url 'post_detail' 'agent-ia' %}" class="nav-link w-fit text-ink hover:text-brand-700">C'est quoi un agent IA&nbsp;?</a>
            </nav>
        </div>

        <div class="border-t border-line">
            <div class="mx-auto flex max-w-[1200px] items-center justify-center px-6 py-5 text-sm text-subtle">
                <p class="flex items-center gap-2.5">
                    <img src="{% static 'img/forge-avatar.svg' %}" alt="" width="24" height="24" class="size-6">
                    <span>Made by F.T</span>
                </p>
            </div>
        </div>
    </footer>

    <script>
      // Apparition au scroll des éléments [data-reveal]
      (() => {
        const items = document.querySelectorAll("[data-reveal]");
        if (!("IntersectionObserver" in window)) {
          items.forEach((el) => el.classList.add("is-visible"));
          return;
        }
        const observer = new IntersectionObserver((entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              entry.target.classList.add("is-visible");
              observer.unobserve(entry.target);
            }
          });
        }, { threshold: 0.12, rootMargin: "0px 0px -40px 0px" });
        items.forEach((el) => observer.observe(el));
      })();
    </script>

    {% block scripts %}{% endblock %}
</body>
</html>
